name: Supplier Collector Windows release
on:
  push:
    branches: [main]
    paths:
      - 'supplier-collector/**'
      - '.github/workflows/collector-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collector-windows
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: supplier-collector
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Test extraction and export
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SupplierCatalogueCollector app.py
      - name: Smoke test packaged GUI
        run: |
          $result = Join-Path $PWD 'smoke-result.json'
          $process = Start-Process -FilePath 'dist/SupplierCatalogueCollector/SupplierCatalogueCollector.exe' -ArgumentList '--smoke-test', $result -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'GUI smoke test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'GUI smoke test failed' }
          $check = Get-Content $result | ConvertFrom-Json
          if ($check.gui -ne 'passed') { throw 'GUI smoke test did not pass' }
      - name: Package and checksum
        run: |
          Copy-Item README.md dist/SupplierCatalogueCollector/README.md
          Compress-Archive -Path dist/SupplierCatalogueCollector/* -DestinationPath Supplier-Catalogue-Collector-Windows.zip
          $hash = (Get-FileHash Supplier-Catalogue-Collector-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Supplier-Catalogue-Collector-Windows.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "collector-v1.0.0-build.${{ github.run_number }}"
          gh release create $tag Supplier-Catalogue-Collector-Windows.zip SHA256SUMS.txt --repo ${{ github.repository }} --target ${{ github.sha }} --title "Supplier Catalogue Collector 1.0.0" --notes-file README.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
