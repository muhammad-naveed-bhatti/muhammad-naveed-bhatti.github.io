'use strict';const $=id=>document.getElementById(id);const text={en:{title:'Warehouse SOP Training',subtitle:'Practice receiving, stock counts and controlled stock issue.',progress:'Your progress',done:'lessons completed',scope:'Sample learning procedures. Follow your employer’s approved SOPs, safety rules and authorization limits.',recordingTitle:'Your training recording',recordingHelp:'Choose a video recorded in your own studio. It plays locally and is not uploaded. Select it again after reloading or changing lessons.',recordingLabel:'Choose lesson video',checkTitle:'Practice checklist',quizTitle:'Knowledge check',submit:'Check answers',retry:'Clear answers',needChecks:'Complete every practice checklist item before taking the knowledge check.',needAnswers:'Answer all three questions.',pass:'Passed',fail:'Review the lesson and try again',score:'Score',feedback:'Correct answer',footer:'Built by Muhammad Naveed Bhatti · Progress is saved in this browser when available. Names and results are self-reported, not a professional certification.',export:'Export progress CSV'},ur:{title:'ویئرہاؤس SOP تربیت',subtitle:'وصولی، اسٹاک گنتی اور مجاز اجرا کی مشق کریں۔',progress:'آپ کی پیش رفت',done:'اسباق مکمل',scope:'یہ نمونہ تربیتی طریقے ہیں۔ اپنے ادارے کے منظور شدہ SOP، حفاظتی اصول اور اختیارات کی پابندی کریں۔',recordingTitle:'آپ کی تربیتی ویڈیو',recordingHelp:'اپنے اسٹوڈیو میں ریکارڈ کی گئی ویڈیو منتخب کریں۔ ویڈیو صرف آپ کے براؤزر میں چلتی ہے، اپ لوڈ نہیں ہوتی۔ صفحہ دوبارہ کھولنے یا سبق بدلنے پر ویڈیو دوبارہ منتخب کریں۔',recordingLabel:'سبق کی ویڈیو منتخب کریں',checkTitle:'عملی چیک لسٹ',quizTitle:'معلومات کی جانچ',submit:'جوابات چیک کریں',retry:'جوابات صاف کریں',needChecks:'جانچ سے پہلے عملی چیک لسٹ کے تمام کام مکمل کریں۔',needAnswers:'تینوں سوالات کے جواب دیں۔',pass:'کامیاب',fail:'سبق دوبارہ پڑھیں اور کوشش کریں',score:'اسکور',feedback:'درست جواب',footer:'محمد نوید بھٹی کا تیار کردہ · براؤزر دستیاب ہونے پر پیش رفت محفوظ رہتی ہے۔ نتائج ذاتی مشق کا ریکارڈ ہیں، پیشہ ورانہ سند نہیں const lessons=[
{id:'receiving',en:{title:'Receiving & inspection',objective:'Accept deliveries against authorized documents and record exceptions.',steps:['Compare the delivery with the purchase order: item specification, unit and ordered quantity.','Count received goods and inspect packaging and visible condition. Record shortages, damage or mismatches.','Separate nonconforming goods for review under your organization’s procedures. Avoid making unverified stock available.','Prepare the goods receipt record with quantities, date and document reference; label and place accepted goods in the assigned location.'],checks:['Compared order and delivery documents','Counted and inspected received goods','Recorded exceptions and the receiving reference'],questions:[['A delivery contains fewer units than the purchase order. What should you record?',['The ordered quantity','The actual received quantity and shortage','No quantity until the next delivery'],1],['What should happen to goods with an unresolved specification mismatch?',['Issue them immediately','Hide the difference','Separate them and refer for review'],2],['What helps trace a receipt later?',['A receiving reference and recorded location','Only the supplier’s first name','An unlabelled carton'],0]]},ur:{title:'وصولی اور معائنہ',objective:'مجاز دستاویزات کے مطابق سامان وصول کریں اور اختلافات درج کریں۔',steps:['ڈلیوری کو پرچیز آرڈر سے ملائیں: سامان کی تفصیل، اکائی اور آرڈر کی مقدار۔','سامان گنیں اور پیکنگ و ظاہری حالت دیکھیں۔ کمی، نقصان یا فرق درج کریں۔','غیر مطابق سامان کو ادارے کے طریقہ کار کے تحت جائزے کے لیے الگ رکھیں۔ غیر تصدیق شدہ سامان دستیاب اسٹاک میں شامل نہ کریں۔','وصولی کا ریکارڈ مقدار، تاریخ اور دستاویزی حوالہ کے ساتھ بنائیں؛ منظور شدہ سامان کو لیبل لگا کر مقررہ جگہ رکھیں۔'],checks:['آرڈر اور ڈلیوری کی دستاویزات ملائیں','سامان گنا اور معائنہ کیا','اختلافات اور وصولی کا حوالہ درج کیا'],questions:[['آرڈر کے مقابلے میں کم سامان آیا ہے۔ کیا درج کریں؟',['آرڈر کی مکمل مقدار','اصل وصول شدہ مقدار اور کمی','اگلی ڈلیوری تک کوئی مقدار نہیں'],1],['سامان کی تفصیل میں غیر حل شدہ فرق ہو تو کیا کریں؟',['فوراً جاری کریں','فرق چھپا دیں','الگ رکھیں اور جائزے کے لیے پیش کریں'],2],['وصولی کا سراغ بعد میں کیسے ملے گا؟',['وصولی کا حوالہ اور درج شدہ مقام','صرف سپلائر کا پہلا نام','بغیر لیبل کا کارٹن'],0]]}},
{id:'counting',en:{title:'Stock count & reconciliation',objective:'Distinguish uncounted items from zero stock and investigate differences.',steps:['Define the count area and control or record stock movements during the count.','Identify the item, location and unit before counting. Count independently and record actual quantity.','Leave uncounted lines pending. Enter zero only after physically checking the location.','Recount discrepancies and review receipt/issue documents. Record an adjustment only with the required reason and authorization.'],checks:['Confirmed item, location and unit','Counted stock and distinguished pending from zero','Recounted differences and checked movement records'],questions:[['What does a blank physical count mean?',['Confirmed zero stock','Item not yet counted','Stock matched'],1],['Recorded stock is 20 and physical count is 17. The variance is:',['−3, a shortage','+3, an excess','0, matched'],0],['Before adjusting a discrepancy, what should you do?',['Delete the old record','Ignore recent issues','Recount and investigate supporting documents'],2]]},ur:{title:'اسٹاک گنتی اور مطابقت',objective:'بغیر گنتی والے سامان اور صفر اسٹاک میں فرق کریں اور اختلافات کی تحقیق کریں۔',steps:['گنتی کا علاقہ طے کریں؛ گنتی کے دوران اسٹاک کی نقل و حرکت روکیں یا ریکارڈ کریں۔','گنتی سے پہلے سامان، جگہ اور اکائی کی شناخت کریں۔ اصل مقدار گن کر درج کریں۔','بغیر گنتی والی سطر کو زیر التوا رکھیں۔ جگہ کو چیک کرنے کے بعد ہی صفر درج کریں۔','اختلافات دوبارہ گنیں اور وصولی و اجرا کی دستاویزات دیکھیں۔ مطلوبہ وجہ اور اجازت کے ساتھ ہی ایڈجسٹمنٹ درج کریں۔'],checks:['سامان، جگہ اور اکائی کی تصدیق کی','گنتی کی اور زیر التوا کو صفر سے الگ رکھا','اختلافات دوبارہ گنے اور نقل و حرکت کا ریکارڈ دیکھا'],questions:[['خالی فزیکل کاؤنٹ کا کیا مطلب ہے؟',['اسٹاک یقینی طور پر صفر ہے','سامان ابھی نہیں گنا گیا','اسٹاک برابر ہے'],1],['ریکارڈ 20 اور اصل گنتی 17 ہے۔ فرق کیا ہے؟',['−3 یعنی کمی','+3 یعنی زائد','0 یعنی برابر'],0],['ایڈجسٹمنٹ سے پہلے کیا کریں؟',['پرانا ریکارڈ حذف کریں','حالیہ اجرا نظر انداز کریں','دوبارہ گنتی اور متعلقہ دستاویزات کی تحقیق'],2]]}},
{id:'issue',en:{title:'Controlled issue & returns',objective:'Maintain traceable stock issue and return records.',steps:['Check the authorized request, item specification and recipient before releasing stock.','Pick the correct item and unit. Apply the relevant stock-rotation policy; check shelf-life or expiry where applicable.','Record issued quantity, date, recipient and issue-document reference. Update stock records promptly.','Inspect returned goods, record their condition and reference the original issue. Route damaged or questionable items for review.'],checks:['Checked request authority and recipient','Confirmed correct item, unit and applicable expiry checks','Recorded issue or return references and condition'],questions:[['What is required before releasing stock?',['An authorized request','A verbal rumor','A blank issue document'],0],['Why keep an issue-document reference?',['To replace counting','To trace movement and recipient','To avoid updating stock'],1],['A returned item is visibly damaged. What should you do?',['Mix it with serviceable stock','Discard all records','Record the condition and route it for review'],2]]},ur:{title:'مجاز اجرا اور واپسی',objective:'سامان کے اجرا اور واپسی کا قابل سراغ ریکارڈ رکھیں۔',steps:['اسٹاک دینے سے پہلے مجاز درخواست، سامان کی تفصیل اور وصول کرنے والے کی تصدیق کریں۔','درست سامان اور اکائی منتخب کریں۔ متعلقہ اسٹاک روٹیشن پالیسی اپنائیں؛ ضرورت کے مطابق شیلف لائف یا میعاد دیکھیں۔','جاری شدہ مقدار، تاریخ، وصول کنندہ اور اجرا کی دستاویز کا حوالہ درج کریں۔ اسٹاک ریکارڈ بروقت اپ ڈیٹ کریں۔','واپس آنے والے سامان کا معائنہ اور حالت درج کریں؛ اصل اجرا کا حوالہ دیں۔ خراب یا مشکوک سامان جائزے کے لیے پیش کریں۔'],checks:['درخواست کے اختیار اور وصول کنندہ کی تصدیق کی','سامان، اکائی اور متعلقہ میعاد چیک کی','اجرا یا واپسی کے حوالے اور حالت درج کی'],questions:[['اسٹاک جاری کرنے سے پہلے کیا ضروری ہے؟',['مجاز درخواست','سنی سنائی بات','خالی اجرا کی دستاویز'],0],['اجرا کی دستاویز کا حوالہ کیوں رکھیں؟',['گنتی کی جگہ استعمال کے لیے','نقل و حرکت اور وصول کنندہ کا سراغ رکھنے کے لیے','اسٹاک اپ ڈیٹ سے بچنے کے لیے'],1],['واپس آنے والا سامان خراب ہے۔ کیا کریں؟',['قابل استعمال سامان میں ملا دیں','تمام ریکارڈ ختم کر دیں','حالت درج کر کے جائزے کے لیے پیش کریں'],2]]}}
];
let lang='en',current=0,progress={},videoUrl=null,storageWarning='';const storageKey='mn-sop-training-v1';try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&typeof saved==='object'&&!Array.isArray(saved))progress=saved;}catch{storageWarning='Browser progress could not be restored.';}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(storageKey,JSON.stringify(progress));}catch{storageWarning='Browser storage unavailable: export progress before closing.';$('footer').textContent=text[lang].footer+' '+storageWarning;}}
function navigation(){const t=text[lang],completed=lessons.filter(l=>progress[l.id]?.passed).length;$('progress-text').textContent=completed+' / 3 '+t.done;$('progress').value=completed;$('lessons').innerHTML='';lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson-button'+(i===current?' active':'');b.innerHTML=esc(l[lang].title)+`<small>${progress[l.id]?.passed?(lang==='ur'?'مکمل':'Completed'):(lang==='ur'?'مشق کے لیے تیار':'Ready to practice')}</small>`;b.onclick=()=>{current=i;render();};$('lessons').append(b);});}
function resetVideo(){if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null;}$('video').pause();$('video').removeAttribute('src');$('video').hidden=true;$('recording').value='';$('recording-name').textContent='';}
function render(){const t=text[lang],l=lessons[current][lang];document.documentElement.lang=lang;$('lesson-content').dir=lang==='ur'?'rtl':'ltr';$('lesson-content').className=lang==='ur'?'urdu':'';for(const [id,key]of [['title','title'],['subtitle','subtitle'],['progress-title','progress'],['scope','scope'],['recording-title','recordingTitle'],['recording-help','recordingHelp'],['recording-label','recordingLabel'],['check-title','checkTitle'],['quiz-title','quizTitle'],['submit','submit'],['retry','retry'],['export','export']])$(id).textContent=t[key];$('footer').textContent=t.footer+' '+storageWarning;$('lesson-title').textContent=l.title;$('objective').textContent=l.objective;$('steps').innerHTML=l.steps.map(s=>'<li>'+esc(s)+'</li>').join('');$('checklist').innerHTML=l.checks.map((s,i)=>`<label class="check"><input type="checkbox" id="check-${i}"><span>${esc(s)}</span></label>`).join('');$('questions').innerHTML=l.questions.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q[0])}</legend>${q[1].map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}">${esc(a)}</label>`).join('')}</fieldset>`).join('');$('feedback').hidden=true;resetVideo();navigation();}
$('quiz').onsubmit=e=>{e.preventDefault();const t=text[lang],l=lessons[current][lang];$('feedback').hidden=false;if([...$('checklist').querySelectorAll('input')].some(c=>!c.checked)){$('feedback').textContent=t.needChecks;return;}const answers=l.questions.map((q,i)=>$('quiz').querySelector(`input[name=q${i}]:checked`));if(answers.some(a=>!a)){$('feedback').textContent=t.needAnswers;return;}const score=answers.reduce((n,a,i)=>n+(Number(a.value)===l.questions[i][2]?1:0),0),passed=score>=2;const previous=progress[lessons[current].id];progress[lessons[current].id]={passed:passed||previous?.passed===true,bestScore:Math.max(score,previous?.bestScore||0),latestScore:score,lastAttempt:new Date().toISOString()};save();$('feedback').innerHTML=`<strong>${passed?t.pass:t.fail} — ${t.score}: ${score}/3</strong>`+l.questions.map((q,i)=>Number(answers[i].value)===q[2]?'':`<p>${i+1}. ${t.feedback}: ${esc(q[1][q[2]])}</p>`).join('');navigation();};
$('retry').onclick=()=>{$('quiz').reset();$('feedback').hidden=true;};$('language').onchange=()=>{lang=$('language').value;render();};$('recording').onchange=()=>{const file=$('recording').files[0];if(!file)return;if(!file.type.startsWith('video/')){$('recording-name').textContent=lang==='ur'?'ویڈیو فائل منتخب کریں۔':'Choose a video file.';return;}if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(file);$('video').src=videoUrl;$('video').hidden=false;$('recording-name').textContent=file.name;};
$('export').onclick=()=>{const rows=['lesson,completed,bestScoreOutOf3,latestScoreOutOf3,lastAttempt'];lessons.forEach(l=>{const r=progress[l.id]||{};rows.push([l.en.title,r.passed?'Yes':'No',r.bestScore??'',r.latestScore??'',r.lastAttempt??''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));});const url=URL.createObjectURL(new Blob([rows.join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='warehouse-training-progress.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></body></html>
